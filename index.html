<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transition Alignment Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h1 { font-size: 1.25rem; margin-bottom: 12px; }

    /* 9:16 vertical viewfinder container */
    .viewfinder {
      position: relative;
      width: 320px;
      height: 568px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
    }

    /* Live camera layer */
    video#camera {
      width: 50%;
      height: 50%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirrored for selfie view */
    }

    /* Ghost image overlay layer */
    #ghostOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.45;
      pointer-events: none; /* Allows taps/clicks to pass through */
      display: none;
    }

    .controls, .sliders {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button.recording { background: #dc2626; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .help-text {
      font-size: 0.85rem;
      color: #888;
      margin-top: 10px;
      text-align: center;
    }

    #recordingsList {
      margin-top: 20px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .clip-card {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <h1>Transition Match Cut Tool</h1>

  <div class="viewfinder">
    <!-- Camera preview -->
    <video id="camera" autoplay playsinline muted></video>
    <!-- Faint ghost overlay -->
    <img id="ghostOverlay" alt="Reference Ghost Frame" />
  </div>

  <div class="sliders">
    <label for="opacitySlider">Ghost Opacity:</label>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.45" />
    <button id="clearGhostBtn">Remove Ghost</button>
  </div>

  <div class="controls">
    <button id="recordBtn">Start Recording</button>
    <button id="snapGhostBtn">Freeze Frame as Ghost</button>
  </div>

  <p class="help-text">Tip: Press <strong>Ctrl+V</strong> (or <strong>Cmd+V</strong>) to paste an image/screenshot directly from your clipboard.</p>

  <div id="recordingsList"></div>

  <script>
    const camera = document.getElementById('camera');
    const ghost = document.getElementById('ghostOverlay');
    const opacitySlider = document.getElementById('opacitySlider');
    const recordBtn = document.getElementById('recordBtn');
    const snapGhostBtn = document.getElementById('snapGhostBtn');
    const clearGhostBtn = document.getElementById('clearGhostBtn');
    const recordingsList = document.getElementById('recordingsList');

    let stream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let takeCount = 1;

    // 1. Request camera stream (portrait 9:16 preferred)
    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 1280 } },
          audio: true
        });
        camera.srcObject = stream;
      } catch (err) {
        alert("Camera access denied or unavailable: " + err.message);
      }
    }
    initCamera();

    // 2. Adjust ghost frame opacity
    opacitySlider.addEventListener('input', (e) => {
      ghost.style.opacity = e.target.value;
    });

    // 3. Clear ghost frame
    clearGhostBtn.addEventListener('click', () => {
      ghost.style.display = 'none';
      ghost.src = '';
    });

    // 4. Snap current camera frame as the ghost overlay
    snapGhostBtn.addEventListener('click', () => {
      if (!camera.videoWidth) return;
      const canvas = document.createElement('canvas');
      canvas.width = camera.videoWidth;
      canvas.height = camera.videoHeight;
      const ctx = canvas.getContext('2d');
      // Mirror the frame to match the mirrored selfie view
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
      ghost.src = canvas.toDataURL('image/png');
      ghost.style.display = 'block';
    });

    // 5. Paste an image straight from clipboard (Ctrl+V / Cmd+V)
    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (event) => {
            ghost.src = event.target.result;
            ghost.style.display = 'block';
          };
          reader.readAsDataURL(blob);
          break;
        }
      }
    });

    // 6. Record ONLY the camera stream (Ghost frame is completely excluded)
    recordBtn.addEventListener('click', () => {
      if (!stream) return;

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recordBtn.textContent = 'Start Recording';
        recordBtn.classList.remove('recording');
      } else {
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          
          const card = document.createElement('div');
          card.className = 'clip-card';
          card.innerHTML = `
            <span>Take #${takeCount++} (Clean Video)</span>
            <a href="${url}" download="take_${takeCount - 1}.webm" style="color: #60a5fa;">Download</a>
          `;
          recordingsList.prepend(card);
        };

        mediaRecorder.start();
        recordBtn.textContent = 'Stop Recording';
        recordBtn.classList.add('recording');
      }
    });
  </script>
</body>
</html>
