<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Transition Alignment Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0f1015;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100dvh;
    }

    h1 {
      font-size: 1.15rem;
      margin-bottom: 8px;
      font-weight: 700;
      text-align: center;
    }

    /* Responsive Viewfinder for phone screens */
    .viewfinder {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: min(60dvh, 480px);
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Live camera layer */
    video#camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Mirroring class for selfie camera */
    video.mirrored {
      transform: scaleX(-1);
    }

    /* Ghost image overlay layer */
    #ghostOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.45;
      pointer-events: none;
      display: none;
    }

    /* Mobile Controls layout */
    .controls-panel {
      width: 100%;
      max-width: 360px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1b23;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    .slider-box input[type="range"] {
      flex: 1;
      accent-color: #3b82f6;
      height: 6px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button, label.file-btn {
      background: #2563eb;
      color: white;
      border: none;
      min-height: 46px;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      user-select: none;
    }

    button:active, label.file-btn:active {
      transform: scale(0.97);
    }

    button.btn-secondary, label.file-btn {
      background: #272833;
    }

    button#recordBtn {
      grid-column: span 2;
      background: #ef4444;
      font-size: 0.95rem;
    }

    button#recordBtn.recording {
      background: #991b1b;
      animation: pulse 1.2s infinite;
    }

      0%, 100% { opacity: 1; }
      50% { opacity: 0.7
