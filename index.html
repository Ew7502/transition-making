<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transition Alignment Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h1 { font-size: 1.25rem; margin-bottom: 12px; }

    .viewfinder {
      position: relative;
      width: 320px;
      height: 568px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video#camera {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
    }

    #ghostOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.45;
      pointer-events: none;
      display: none;
    }

    .controls, .sliders {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button.recording { background: #dc2626; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .help-text {
      font-size: 0.85rem;
      color: #888;
      margin-top: 10px;
      text-align: center;
    }

    #recordingsList {
      margin-top: 20px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .clip-card {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <h1>Transition Match Cut Tool</h1>

  <div class="viewfinder">
    <video id="camera" autoplay playsinline muted></video>
    <img id="ghostOverlay" alt="Reference Ghost Frame" />
  </div>

  <div class="sliders">
    <label for="opacitySlider">Ghost Opacity:</label>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.45" />
    <button id="clearGhostBtn">Remove Ghost</button>
  </div>

  <div class="controls">
    <button id="recordBtn">Start Recording</button>
    <button id="snapGhostBtn">Freeze Frame as Ghost</button>
  </div>

  <p class="help-text">Tip: Press <strong>Ctrl+V</strong> (or <strong>Cmd+V</strong>) to paste an image/screenshot directly from your clipboard.</p>

  <div id="recordingsList"></div>

  <script>
    const camera = document.getElementById('camera');
    const ghost = document.getElementById('ghostOverlay');
    const opacitySlider = document.getElementById('opacitySlider');
    const recordBtn = document.getElementById('recordBtn');
    const snapGhostBtn = document.getElementById('snapGhostBtn');
    const clearGhostBtn = document.getElementById('clearGhostBtn');
    const recordingsList = document.getElementById('recordingsList');

    let stream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let takeCount = 1;

    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: true
        });
        camera.srcObject = stream;
      } catch (err) {
        alert("Camera access denied or unavailable: " + err.message);
      }
    }
    initCamera();

    opacitySlider.addEventListener('input', (e) => {
      ghost.style.opacity = e.target.value;
    });

    clearGhostBtn.addEventListener('click', () => {
      ghost.style.display = 'none';
      ghost.src = '';
    });
